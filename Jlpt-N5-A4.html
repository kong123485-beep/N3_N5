:root {
  --paper: #eceae3;
  --surface: #ffffff;
  --ink: #17171a;
  --muted: #5f5f66;
  --line: #e4e2dc;
  --blue: #1757b8;
  --blue-tint: #e8f1ff;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #17181a;
    --surface: #222328;
    --ink: #f4f2ed;
    --muted: #b9b8b2;
    --line: #3b3c41;
    --blue: #8fb7ff;
    --blue-tint: #26344c;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}

.app-shell {
  padding-top: var(--safe-area-inset-top);
}

.sheet {
  min-width: 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(20, 20, 20, 0.06);
}

.tag {
  display: inline-flex;
  align-items: center;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 14px;
  font-weight: 800;
}

.pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  padding: 4px 8px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.35;
}

.bar {
  display: inline-block;
  width: 5px;
  height: 20px;
  border-radius: 999px;
  flex: 0 0 auto;
}

button:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}

@media (max-width: 480px) {
  .card {
    padding: 16px;
    border-radius: 16px;
  }
}

.hover\:border-\[var\(--ink\)\]:hover {
  border-color: var(--ink);
}

.hover\:bg-\[var\(--paper\)\]:hover {
  background-color: var(--paper);
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-\[30px\] {
    font-size: 30px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-1 {
    grid-template-columns: repeat(1, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1280px) {
  .xl\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
