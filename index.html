* {
  box-sizing: border-box;
}

html {
  background: var(--page);
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--page);
  font-family: "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
}

ruby {
  ruby-align: center;
}

rt {
  font-size: .62em;
  line-height: 1;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: .02em;
}

::-moz-selection {
  background: #bfeef5;
  color: #123;
}

::selection {
  background: #bfeef5;
  color: #123;
}

.marker\:text-\[var\(--blue\)\] *::marker {
  color: var(--blue);
}

.marker\:text-\[var\(--blue\)\]::marker {
  color: var(--blue);
}

.hover\:-translate-y-0\.5:hover {
  --tw-translate-y: -0.125rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-\[\#9ad9e3\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(154 217 227 / var(--tw-border-opacity, 1));
}

.hover\:bg-\[\#fbfdff\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(251 253 255 / var(--tw-bg-opacity, 1));
}

.hover\:decoration-\[var\(--accent\)\]:hover {
  text-decoration-color: var(--accent);
}

.hover\:opacity-90:hover {
  opacity: 0.9;
}

.hover\:shadow-\[0_10px_22px_rgba\(20\2c 108\2c 125\2c 0\.10\)\]:hover {
  --tw-shadow: 0 10px 22px rgba(20,108,125,0.10);

  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.focus-visible\:outline-2:focus-visible {
  outline-width: 2px;
}

.focus-visible\:outline-offset-2:focus-visible {
  outline-offset: 2px;
}

.focus-visible\:outline-\[var\(--accent\)\]:focus-visible {
  outline-color: var(--accent);
}

.group:hover .group-hover\:border-\[var\(--accent\)\] {
  border-color: var(--accent);
}

.group:hover .group-hover\:bg-\[var\(--accent\)\] {
  background-color: var(--accent);
}

.group:hover .group-hover\:text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}
