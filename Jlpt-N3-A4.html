:root{
  --paper:#ffffff;
  --surface:#f4f2ec;
  --ink:#17171a;
  --muted:#6b6b72;
  --line:#d9d7d0;
  --blue:#2563eb;
  --green:#15803d;
  --orange:#ea580c;
  --purple:#7c3aed;
  --blue-soft:#eff6ff;
  --green-soft:#f0fdf4;
  --orange-soft:#fff7ed;
  --purple-soft:#faf5ff;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#1c1c1f;
    --surface:#121214;
    --ink:#f4f2ec;
    --muted:#b8b6ae;
    --line:#3a3a3f;
    --blue:#60a5fa;
    --green:#4ade80;
    --orange:#fb923c;
    --purple:#c084fc;
    --blue-soft:#17263f;
    --green-soft:#172a21;
    --orange-soft:#2e211a;
    --purple-soft:#2a2036;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif
}

.jp{
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","PingFang HK","Microsoft JhengHei",sans-serif
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace
}

button{
  font:inherit
}

a{
  color:inherit
}

.first\:mt-0:first-child {
  margin-top: 0px;
}

.hover\:bg-\[var\(--surface\)\]:hover {
  background-color: var(--surface);
}

@media (min-width: 480px) {
  .min-\[480px\]\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 640px) {

  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .sm\:gap-3 {

  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-8 {
    padding-top: 2rem;
  }

  .sm\:text-\[21px\] {
    font-size: 21px;
  }

  .sm\:text-\[22px\] {
    font-size: 22px;
  }

  .sm\:text-\[30px\] {
    font-size: 30px;
  }
}

@media (min-width: 768px) {
  .md\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1280px) {
  .xl\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .xl\:grid-cols-3 {
